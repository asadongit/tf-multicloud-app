name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      TOKEN_OPTIMIZATION_MODE: "true"
      MAX_HISTORY_TURNS: "2"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync

    - name: Run linting
      run: uv run python -m py_compile app/main.py app/worker.py app/mcp_server.py app/core/llm_orchestrator.py app/core/history_manager.py app/api/chat.py app/api/deployments.py app/api/tasks.py app/api/admin.py

    - name: Run tests
      run: uv run pytest --tb=short -q
